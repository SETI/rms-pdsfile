name: Run Tests
run-name: "Run Tests: ${{ github.ref_type }} ${{ github.ref_name }} by ${{ github.triggering_actor }}"

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    branches: [ rewrite ]
  push:
    branches: [ main ]
  schedule:
    - cron: "00 08 * * *"   # 12am PST, 1am PDT

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test pdsfile
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Self-hosted Linux runs the full multi-Python-version test. Windows is
        # no longer supported and has been removed from the matrix. macOS entries
        # are kept commented for possible future re-enablement.
        #
        # MacOS: Python 3.8-3.10 does not currently work on MacOS.
        include:
          - os: self-hosted-linux
            python-version: "3.10"
          - os: self-hosted-linux
            python-version: "3.11"
          - os: self-hosted-linux
            python-version: "3.12"
          - os: self-hosted-linux
            python-version: "3.13"
          #- os: self-hosted-macos
          #  python-version: "3.11"
          #- os: self-hosted-macos
          #  python-version: "3.12"
          #- os: self-hosted-macos
          #  python-version: "3.13"
      fail-fast: true
    steps:
      - name: Checkout rms-pdsfile
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test with coverage
        # Because self-hosted runners keep a global Python environment that
        # isn't wiped between runs, the various requirements.txt files will
        # interfere with each other. As a result, we use a venv for cases
        # where it matters.
        run: |
          echo
          env
          echo
          rm -rf venv
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install wheel
          python -m pip install -e ".[dev]"
          echo
          python -m pip freeze
          echo
          scripts/automated_tests/pdsfile_main_test.sh

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v5
        if: matrix.os == 'self-hosted-linux' && matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
